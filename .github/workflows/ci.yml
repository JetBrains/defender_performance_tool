name: Build and Test

on:
  push:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore src/DefenderPerformanceTool.slnx

      - name: Build
        run: dotnet build src/DefenderPerformanceTool.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/DefenderPerformanceTool.slnx --configuration Release --no-build

      - name: Publish DefenderPerformanceTool
        run: dotnet publish src/DefenderPerformanceTool/DefenderPerformanceTool.csproj -c Release --no-build

      - name: Publish DefenderCpuTime
        run: dotnet publish src/DefenderCpuTime/DefenderCpuTime.csproj -c Release --no-build

      - name: Upload DefenderPerformanceTool artifact
        uses: actions/upload-artifact@v4
        with:
          name: DefenderPerformanceTool
          path: src/DefenderPerformanceTool/bin/Release/net48/publish/

      - name: Upload DefenderCpuTime artifact
        uses: actions/upload-artifact@v4
        with:
          name: DefenderCpuTime
          path: src/DefenderCpuTime/bin/Release/net48/publish/
